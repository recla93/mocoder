name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    # the checks run real commands: decoding, process killing and paths differ by OS
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Python example, red → green
        run: npm run verify -- ../examples/analisi-spese/.mocoder/backlog.yaml ../examples/analisi-spese/.mocoder/solution.yaml
      - name: TypeScript example, red → green
        run: npm run verify -- ../examples/contatore-parole/.mocoder/backlog.yaml ../examples/contatore-parole/.mocoder/solution.yaml

  java-example:
    # Maven downloads its plugins on the first build: once, on one OS, is enough.
    # No setup-java maven cache: it needs a pom.xml in the repo, and the example's pom.xml is written by the student.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'   # the Java example compiles with maven.compiler.release 21
      - run: npm ci
      - name: Java example, red → green
        run: npm run verify -- ../examples/registro-presenze/.mocoder/backlog.yaml ../examples/registro-presenze/.mocoder/solution.yaml

  package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - run: npm run package
      - uses: actions/upload-artifact@v5
        with:
          name: mocoder-vsix
          path: extension/mocoder.vsix
