              raise NotImplementedError
      - path: tests/test_load.py
        given: true
        content: |
          from datetime import date
          from decimal import Decimal

          import pytest

          from spese.load import Expense, load_expenses


          def write(tmp_path, text):
              p = tmp_path / "spese.csv"
              p.write_text(text, encoding="utf-8")
              return p


          def test_reads_rows(tmp_path):
              p = write(tmp_path, "date,category,amount\n2026-11-02,cibo,12.50\n2026-11-03,casa,800\n")
              assert load_expenses(p) == [
                  Expense(date(2026, 11, 2), "cibo", Decimal("12.50")),
                  Expense(date(2026, 11, 3), "casa", Decimal("800")),
              ]


          def test_category_is_normalized(tmp_path):
              p = write(tmp_path, "date,category,amount\n2026-11-02,  Cibo ,1\n")
              assert load_expenses(p)[0].category == "cibo"


          def test_only_header_means_no_expenses(tmp_path):
              assert load_expenses(write(tmp_path, "date,category,amount\n")) == []


          @pytest.mark.parametrize("row", [
              "2026-13-01,cibo,1",
              "2026-11-02,cibo,dodici",
              "2026-11-02,,1",
              "2026-11-02,cibo,-5",
          ])
          def test_bad_row_reports_line_number(tmp_path, row):
              p = write(tmp_path, f"date,category,amount\n2026-11-01,cibo,1\n{row}\n")
              with pytest.raises(ValueError, match="riga 3"):
                  load_expenses(p)
    hints:
      - "Apri il file con `with open(path, newline=\"\", encoding=\"utf-8\") as f:` e scorri `csv.DictReader(f)`. `enumerate(..., start=2)` ti dà il numero di riga."
      - "Converti ogni riga in una funzione a parte (`parse_row`) e avvolgi la chiamata in `try/except (ValueError, InvalidOperation)` per aggiungere `riga N` al messaggio."
      - |
        ```python
        def load_expenses(path: Path) -> list[Expense]:
            expenses = []
            with open(path, newline="", encoding="utf-8") as f:
                for line, row in enumerate(csv.DictReader(f), start=2):
                    try:
                        expenses.append(parse_row(row))
                    except (ValueError, InvalidOperation) as e:
                        raise ValueError(f"riga {line}: {e}") from e
            return expenses


        def parse_row(row: dict[str, str]) -> Expense:
            category = row["category"].strip().lower()
            if not category:
                raise ValueError("categoria mancante")
            amount = Decimal(row["amount"])
            if amount < 0:
                raise ValueError(f"importo negativo: {amount}")
            return Expense(date.fromisoformat(row["date"]), category, amount)
        ```
    checks:
      - run: python -m pytest -q tests/test_load.py
    review:
      - Nessun float per gli importi
      - Il messaggio di errore permette di trovare la riga nel file

  - id: T02
    milestone: M1
    title: Totali per categoria
    depends_on: [T01]
    goal: totals_by_category somma gli importi per categoria, dalla più costosa.
    learn: [dizionari, defaultdict, ordinamento]
    search: ["python defaultdict", "python sorted key tuple"]
    theory: |
      **Aggregare.** È l'operazione base dell'analisi dati: raggruppi per una chiave e sommi.
      In Python basta un dizionario. `collections.defaultdict(Decimal)` parte da `Decimal(0)`
      per ogni chiave nuova, quindi scrivi solo `totals[categoria] += importo`.

      **La funzione da creare**, nel nuovo file `spese/report.py`:
      `totals_by_category(expenses: list[Expense]) -> dict[str, Decimal]`

      **Ordine.** Dalla categoria con il totale più alto; a parità di totale, in ordine alfabetico.
      I dizionari Python mantengono l'ordine di inserimento, quindi puoi costruirne uno da una
      lista ordinata: `dict(sorted(items, key=...))`.
      La chiave di ordinamento può essere una tupla: `(-totale, nome)` ordina per totale
      decrescente e poi per nome.

      **Errori tipici:** `sum` di Decimal partendo da `0` intero (funziona, ma meglio `Decimal()`);
      ordinare con `reverse=True`, che inverte anche l'ordine alfabetico.
    files:
      - path: spese/report.py
      - path: tests/test_report.py
        given: true
        content: |
          from datetime import date
          from decimal import Decimal

          from spese.load import Expense
          from spese.report import totals_by_category


          def e(day, category, amount):
              return Expense(date.fromisoformat(day), category, Decimal(amount))


          def test_sums_per_category():
              result = totals_by_category([
                  e("2026-11-01", "cibo", "10.10"),
                  e("2026-11-02", "casa", "800"),
                  e("2026-11-03", "cibo", "0.20"),
              ])
              assert result == {"casa": Decimal("800"), "cibo": Decimal("10.30")}


          def test_biggest_first_then_by_name():
              result = totals_by_category([e("2026-11-01", "b", "5"), e("2026-11-01", "a", "5"), e("2026-11-01", "c", "7")])
              assert list(result) == ["c", "a", "b"]


          def test_no_expenses():
              assert totals_by_category([]) == {}


          def test_money_is_exact():
              result = totals_by_category([e("2026-11-01", "x", "0.1"), e("2026-11-01", "x", "0.2")])
              assert result["x"] == Decimal("0.3")
    hints:
      - "`totals = defaultdict(Decimal)` e un ciclo `for x in expenses: totals[x.category] += x.amount`."
      - "Per l'ordine: `sorted(totals.items(), key=lambda kv: (-kv[1], kv[0]))`, poi `dict(...)`."
      - |
        ```python
        from collections import defaultdict
        from decimal import Decimal

        from spese.load import Expense


        def totals_by_category(expenses: list[Expense]) -> dict[str, Decimal]:
            totals: dict[str, Decimal] = defaultdict(Decimal)
            for x in expenses:
                totals[x.category] += x.amount
            return dict(sorted(totals.items(), key=lambda kv: (-kv[1], kv[0])))
        ```
    checks:
      - run: python -m pytest -q tests/test_report.py
    review:
      - La funzione non legge file e non stampa nulla
      - Restituisce un dict normale, non un defaultdict

  - id: T03
    milestone: M1
    title: Totali per mese, test prima
    depends_on: [T02]
    goal: totals_by_month raggruppa per anno-mese in ordine cronologico, guidata da un tuo test.
    learn: [tdd, date-formattazione]
    search: ["test driven development pytest", "python datetime strftime"]
    theory: |
      **Test-Driven Development.** Prima scrivi un test che fallisce (rosso), poi il codice minimo
      che lo fa passare (verde), poi sistemi il codice (refactor). Ti costringe a decidere cosa
      vuoi prima di come farlo.

      **Il comportamento:** `totals_by_month(expenses) -> dict[str, Decimal]` in `spese/report.py`
      - chiave `"AAAA-MM"`, es. `"2026-11"` (l'anno conta: novembre 2025 ≠ novembre 2026)
      - mesi in ordine cronologico

      **Come procedere:** apri `tests/test_month.py`, sostituisci `pytest.fail(...)` con un test vero,
      eseguilo e guardalo fallire. Poi scrivi la funzione. Il controllo esegue tutti i test,
      compreso il nostro `test_month_check.py`.

      **Formattare date.** `giorno.strftime("%Y-%m")` produce `"2026-11"`. Con questo formato
      l'ordine alfabetico coincide con quello cronologico: basta `sorted`.

      **Riconosci la duplicazione.** La nuova funzione assomiglia molto a `totals_by_category`.
      Prima falla funzionare, poi chiediti se vale la pena unificarle (non sempre).
    files:
      - path: tests/test_month.py
        content: |
          import pytest


          def test_groups_by_month():
              # TODO: crea qualche Expense in mesi diversi e verifica il risultato di totals_by_month
              pytest.fail("Scrivi il test prima del codice")
      - path: spese/report.py
      - path: tests/test_month_check.py
        given: true
        content: |
          from datetime import date
          from decimal import Decimal

          from spese.load import Expense
          from spese.report import totals_by_month


          def e(day, amount):
              return Expense(date.fromisoformat(day), "x", Decimal(amount))


          def test_groups_and_orders_months():
              result = totals_by_month([e("2026-12-01", "5"), e("2026-11-30", "1.50"), e("2026-11-01", "2")])
              assert result == {"2026-11": Decimal("3.50"), "2026-12": Decimal("5")}
              assert list(result) == ["2026-11", "2026-12"]


          def test_year_matters():
              assert list(totals_by_month([e("2026-11-01", "1"), e("2025-11-01", "2")])) == ["2025-11", "2026-11"]


          def test_no_expenses():
              assert totals_by_month([]) == {}
    hints:
      - "Nel test: importa `Expense` e `totals_by_month`, crea tre spese (due a novembre, una a dicembre) e confronta con il dizionario atteso."
      - "La funzione è uguale a `totals_by_category`, ma la chiave è `x.day.strftime(\"%Y-%m\")` e l'ordinamento è semplicemente `sorted(totals.items())`."
      - |
        ```python
        # tests/test_month.py
        from datetime import date
        from decimal import Decimal

        from spese.load import Expense
        from spese.report import totals_by_month


        def test_groups_by_month():
            expenses = [
                Expense(date(2026, 11, 2), "cibo", Decimal("10")),
                Expense(date(2026, 11, 20), "casa", Decimal("5")),
                Expense(date(2026, 12, 1), "cibo", Decimal("1")),
            ]
            assert totals_by_month(expenses) == {"2026-11": Decimal("15"), "2026-12": Decimal("1")}

        # spese/report.py
        def totals_by_month(expenses: list[Expense]) -> dict[str, Decimal]:
            totals: dict[str, Decimal] = defaultdict(Decimal)
            for x in expenses:
                totals[x.day.strftime("%Y-%m")] += x.amount
            return dict(sorted(totals.items()))
        ```
    checks:
      - run: python -m pytest -q
    review:
      - Il tuo test fallirebbe se l'anno venisse ignorato?
      - La duplicazione con totals_by_category è consapevole

  - id: T04
    milestone: M2
    title: Il comando report
    depends_on: [T03]
    goal: python -m spese file.csv stampa il report; gli errori vanno su stderr con un exit code diverso da 0.
    learn: [cli, exit-code, stderr, formattazione-stringhe]
    search: ["python __main__.py python -m", "python sys.exit exit code stderr"]
    theory: |
      **Un programma da terminale vero.** `python -m spese spese.csv` esegue il file
      `spese/__main__.py`. Mettiamo la logica in `main(argv: list[str] | None = None) -> int`:
      riceve gli argomenti e **restituisce** l'exit code. Così il test la chiama direttamente.
      In fondo al file: `if __name__ == "__main__": sys.exit(main())`.

      **Exit code e stderr.** Per convenzione `0` = tutto bene, altro = errore. I messaggi di errore
      vanno su `sys.stderr`, così chi usa il programma in uno script può separarli dall'output.
      - nessun argomento o troppi → `uso: python -m spese <file.csv>` su stderr, exit code `2`
      - file inesistente → `File non trovato: <percorso>`, exit code `1`
      - dati sbagliati → `Errore: <messaggio>` (contiene già `riga N`), exit code `1`

      **Il formato del report** (nome allineato a sinistra su 10 caratteri, importo a destra su 10 con 2 decimali):
      ```
      Per categoria
        casa          800.00
        cibo           12.80
      Per mese
        2026-11        12.80
        2026-12       800.00
      Totale          812.80
      ```
      Le f-string formattano anche i Decimal: `f"  {nome:<10}{importo:>10.2f}"`. Per `Totale`: `f"{'Totale':<12}{totale:>10.2f}"`.

      Prova anche a mano: crea un `spese.csv` e lancia `python -m spese spese.csv`.
    files:
      - path: spese/__main__.py
      - path: tests/test_main.py
        given: true
        content: |
          from spese.__main__ import main

          CSV = "date,category,amount\n2026-11-02,cibo,12.50\n2026-12-01,casa,800\n2026-11-03,cibo,0.30\n"


          def test_prints_report(tmp_path, capsys):
              p = tmp_path / "spese.csv"
              p.write_text(CSV, encoding="utf-8")
              assert main([str(p)]) == 0
              assert capsys.readouterr().out.splitlines() == [
                  "Per categoria",
                  "  casa          800.00",
                  "  cibo           12.80",
                  "Per mese",
                  "  2026-11        12.80",
                  "  2026-12       800.00",
                  "Totale          812.80",
              ]


          def test_usage_when_argument_missing(capsys):
              assert main([]) == 2
              assert "uso:" in capsys.readouterr().err


          def test_missing_file(tmp_path, capsys):
              assert main([str(tmp_path / "no.csv")]) == 1
              assert "File non trovato" in capsys.readouterr().err


          def test_bad_data_is_reported(tmp_path, capsys):
              p = tmp_path / "spese.csv"
              p.write_text("date,category,amount\n2026-11-02,cibo,x\n", encoding="utf-8")
              assert main([str(p)]) == 1
              assert "riga 2" in capsys.readouterr().err
    hints:
      - "`args = sys.argv[1:] if argv is None else argv`, poi controlla `len(args)`. `print(..., file=sys.stderr)` scrive su stderr."
      - "Avvolgi `load_expenses` in `try` con due `except`: `FileNotFoundError` e `ValueError`. Le due sezioni del report si stampano allo stesso modo: una piccola funzione `section(titolo, totali)` evita di ripetere il ciclo."
      - |
        ```python
        import sys
        from decimal import Decimal
        from pathlib import Path

        from spese.load import load_expenses
        from spese.report import totals_by_category, totals_by_month


        def main(argv: list[str] | None = None) -> int:
            args = sys.argv[1:] if argv is None else argv
            if len(args) != 1:
                print("uso: python -m spese <file.csv>", file=sys.stderr)
                return 2
            try:
                expenses = load_expenses(Path(args[0]))
            except FileNotFoundError:
                print(f"File non trovato: {args[0]}", file=sys.stderr)
                return 1
            except ValueError as e:
                print(f"Errore: {e}", file=sys.stderr)
                return 1
            section("Per categoria", totals_by_category(expenses))
            section("Per mese", totals_by_month(expenses))
            print(f"{'Totale':<12}{sum((x.amount for x in expenses), Decimal()):>10.2f}")
            return 0


        def section(title: str, totals: dict[str, Decimal]) -> None:
            print(title)
            for name, amount in totals.items():
                print(f"  {name:<10}{amount:>10.2f}")


        if __name__ == "__main__":
            sys.exit(main())
        ```
    checks:
      - run: python -m pytest -q
    review:
      - Gli errori vanno su stderr, il report su stdout
      - main restituisce l'exit code invece di chiamare sys.exit in più punti
