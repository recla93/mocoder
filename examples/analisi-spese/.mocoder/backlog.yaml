schema: 1
project: analisi-spese
title: Analisi spese
summary: >
  Un programma che legge le tue spese da un file CSV e stampa i totali per categoria
  e per mese. Primo passo nell'analisi dati con Python, senza librerie esterne.
level: principiante
estimate_hours: 5
stack: [python-3.11, pytest]
conventions:
  - Struttura — codice nel package spese/, test in tests/
  - Build — pyproject.toml descrive il progetto; dipendenze con versioni esplicite
  - Git — __pycache__/, .pytest_cache/ e .venv/ fuori da git; un commit per task
  - Dati — gli importi sono sempre Decimal, mai float
  - Sicurezza — ogni riga del CSV si valida; un errore indica la riga senza esporre dettagli interni
  - Stile — PEP 8 (ruff o black), nomi in inglese, funzioni piccole
  - Errori — messaggi su stderr ed exit code diverso da 0

milestones:
  - id: M1
    title: Leggere e aggregare i dati
    goal: Le spese vengono lette dal CSV, validate e sommate per categoria e per mese.
  - id: M2
    title: Il report
    goal: Un comando da terminale stampa il report o un errore comprensibile.

tasks:
  - id: T01
    milestone: M1
    title: Leggere il CSV
    goal: load_expenses legge il file e rifiuta le righe sbagliate indicando il numero di riga.
    learn: [dataclass, modulo-csv, decimal, pathlib, pytest]
    search: ["python csv DictReader", "python decimal vs float money", "python dataclass frozen"]
    theory: |
      **Il progetto.** `pyproject.toml` descrive il progetto Python e configura pytest.
      Il codice sta nel *package* `spese` (una cartella con `__init__.py`), i test in `tests/`.
      Ti serve pytest: `python -m pip install pytest`.

      **Dati con forma precisa.** Una spesa ha giorno, categoria e importo. Una `@dataclass(frozen=True)`
      crea la classe con costruttore, confronto e immutabilità.

      **Soldi = Decimal, mai float.** `0.1 + 0.2` con i float fa `0.30000000000000004`.
      `Decimal("0.1") + Decimal("0.2")` fa esattamente `0.3`. Nei dati finanziari è obbligatorio.

      **Leggere un CSV.** Il modulo standard `csv` gestisce virgolette e separatori.
      `csv.DictReader` usa la prima riga come intestazione (`date,category,amount`) e ti dà ogni riga
      come dizionario. Apri il file con `newline=""` e `encoding="utf-8"`.

      **Regole:**
      - categoria senza spazi ai lati e in minuscolo; vuota → errore
      - data in formato `AAAA-MM-GG` (`date.fromisoformat`)
      - importo non negativo
      - ogni errore diventa `ValueError("riga N: ...")`: l'intestazione è la riga 1

      **Errori tipici:** `Decimal("x")` non lancia `ValueError` ma `InvalidOperation`;
      contare le righe partendo da 0.
    files:
      - path: pyproject.toml
        given: true
        content: |
          [project]
          name = "analisi-spese"
          version = "0.1.0"
          requires-python = ">=3.11"

          [tool.pytest.ini_options]
          pythonpath = ["."]
          testpaths = ["tests"]
      - path: .gitignore
        given: true
        content: |
          __pycache__/
          .pytest_cache/
          .venv/
      - path: README.md
        given: true
        content: |
          # Analisi spese

          Totali per categoria e per mese da un file CSV (date,category,amount).

          - Test: `python -m pytest -q`
          - Avviare: `python -m spese spese.csv`
      - path: spese/__init__.py
        given: true
        content: ""
      - path: spese/load.py
        content: |
