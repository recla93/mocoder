    - path: src/main/java/it/presenze/cli/Cli.java
      content: |
        package it.presenze.cli;

        import it.presenze.model.AttendanceStatus;
        import it.presenze.model.Register;
        import it.presenze.model.Student;

        import java.time.DateTimeException;
        import java.time.LocalDate;
        import java.util.stream.Collectors;

        public class Cli {

            private static final String HELP = """
                    Comandi:
                      add <id> <email> <nome completo>
                      mark <id> <aaaa-mm-gg> <PRESENT|ABSENT|LATE>
                      status <id> <aaaa-mm-gg>
                      absences <id>
                      list
                      help
                      exit""";

            private final Register register;

            public Cli(Register register) {
                this.register = register;
            }

            public String execute(String line) {
                if (line.isBlank()) return "";
                String[] p = line.trim().split("\s+", 4);
                try {
                    return switch (p[0]) {
                        case "add" -> {
                            args(p, 4, "add <id> <email> <nome completo>");
                            register.addStudent(new Student(p[1], p[3], p[2]));
                            yield "Aggiunto " + p[1];
                        }
                        case "mark" -> {
                            args(p, 4, "mark <id> <aaaa-mm-gg> <stato>");
                            LocalDate date = LocalDate.parse(p[2]);
                            AttendanceStatus status = AttendanceStatus.valueOf(p[3].toUpperCase());
                            register.mark(p[1], date, status);
                            yield "Segnato " + p[1] + " " + date + " " + status;
                        }
                        case "status" -> {
                            args(p, 3, "status <id> <aaaa-mm-gg>");
                            yield register.statusOf(p[1], LocalDate.parse(p[2]))
                                    .map(Enum::name)
                                    .orElse("Nessuna registrazione");
                        }
                        case "absences" -> {
                            args(p, 2, "absences <id>");
                            yield String.valueOf(register.absences(p[1]));
                        }
                        case "list" -> register.students().isEmpty()
                                ? "Nessuno studente"
                                : register.students().stream()
                                        .map(s -> s.id() + " - " + s.fullName())
                                        .collect(Collectors.joining("\n"));
                        case "help" -> HELP;
                        default -> "Comando sconosciuto: " + p[0] + ". Scrivi help.";
                    };
                } catch (IllegalArgumentException | DateTimeException e) {
                    return "Errore: " + e.getMessage();
                }
            }

            private static void args(String[] parts, int expected, String usage) {
                if (parts.length != expected) throw new IllegalArgumentException("uso: " + usage);
            }
        }
