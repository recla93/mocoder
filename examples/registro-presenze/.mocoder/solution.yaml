    - path: src/main/java/it/presenze/App.java
      content: |
        package it.presenze;

        import it.presenze.cli.Cli;
        import it.presenze.model.Register;
        import it.presenze.store.CsvStore;

        import java.io.*;
        import java.nio.charset.StandardCharsets;
        import java.nio.file.Path;

        public class App {

            public static void main(String[] args) throws IOException {
                Path data = Path.of(args.length > 0 ? args[0] : "presenze.csv");
                run(System.in, System.out, data);
            }

            public static void run(InputStream in, PrintStream out, Path dataFile) throws IOException {
                Register register = CsvStore.load(dataFile);
                Cli cli = new Cli(register);
                out.println("Registro presenze. Scrivi help per i comandi, exit per uscire.");
                BufferedReader reader = new BufferedReader(new InputStreamReader(in, StandardCharsets.UTF_8));
                String line;
                while ((line = reader.readLine()) != null && !line.trim().equals("exit")) {
                    String answer = cli.execute(line);
                    if (!answer.isEmpty()) out.println(answer);
                    CsvStore.save(register, dataFile);
                }
            }
        }
