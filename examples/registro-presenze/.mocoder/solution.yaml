    - path: src/main/java/it/presenze/store/CsvStore.java
      content: |
        package it.presenze.store;

        import it.presenze.model.*;

        import java.io.IOException;
        import java.nio.file.Files;
        import java.nio.file.Path;
        import java.time.LocalDate;
        import java.util.ArrayList;
        import java.util.List;

        public final class CsvStore {

            private CsvStore() {
            }

            public static void save(Register register, Path file) throws IOException {
                List<String> lines = new ArrayList<>();
                for (Student s : register.students())
                    lines.add(join("S", s.id(), s.fullName(), s.email()));
                for (Attendance a : register.attendances())
                    lines.add(join("A", a.studentId(), a.date().toString(), a.status().name()));
                Files.write(file, lines);
            }

            public static Register load(Path file) throws IOException {
                Register register = new Register();
                if (Files.notExists(file)) return register;
                for (String line : Files.readAllLines(file)) {
                    if (line.isBlank()) continue;
                    String[] p = line.split(";", -1);
                    if (p.length != 4) throw new IOException("riga non valida: " + line);
                    switch (p[0]) {
                        case "S" -> register.addStudent(new Student(p[1], p[2], p[3]));
                        case "A" -> register.mark(p[1], LocalDate.parse(p[2]), AttendanceStatus.valueOf(p[3]));
                        default -> throw new IOException("riga non valida: " + line);
                    }
                }
                return register;
            }

            private static String join(String... fields) {
                for (String f : fields)
                    if (f.contains(";")) throw new IllegalArgumentException("';' non ammesso: " + f);
                return String.join(";", fields);
            }
        }
