      - path: src/test/java/it/presenze/model/RegisterTest.java
        given: true
        content: |
          package it.presenze.model;

          import org.junit.jupiter.api.BeforeEach;
          import org.junit.jupiter.api.Test;

          import java.time.LocalDate;
          import java.util.List;
          import java.util.Optional;

          import static org.junit.jupiter.api.Assertions.*;

          class RegisterTest {

              private static final LocalDate DAY = LocalDate.of(2026, 11, 7);
              private Register register;

              @BeforeEach
              void setUp() {
                  register = new Register();
                  register.addStudent(new Student("s1", "Mario Rossi", "mario@scuola.it"));
              }

              @Test
              void rejectsDuplicateStudent() {
                  assertThrows(IllegalArgumentException.class,
                          () -> register.addStudent(new Student("s1", "Altro Nome", "altro@scuola.it")));
              }

              @Test
              void marksAndReadsStatus() {
                  register.mark("s1", DAY, AttendanceStatus.PRESENT);
                  assertEquals(Optional.of(AttendanceStatus.PRESENT), register.statusOf("s1", DAY));
              }

              @Test
              void noMarkMeansEmpty() {
                  assertTrue(register.statusOf("s1", DAY).isEmpty());
              }

              @Test
              void secondMarkSameDayReplacesFirst() {
                  register.mark("s1", DAY, AttendanceStatus.PRESENT);
                  register.mark("s1", DAY, AttendanceStatus.LATE);
                  assertEquals(Optional.of(AttendanceStatus.LATE), register.statusOf("s1", DAY));
                  assertEquals(1, register.attendances().size());
              }

              @Test
              void rejectsUnknownStudent() {
                  assertThrows(IllegalArgumentException.class, () -> register.mark("x", DAY, AttendanceStatus.ABSENT));
              }

              @Test
              void listsAreReadOnly() {
                  assertEquals(1, register.students().size());
                  assertThrows(UnsupportedOperationException.class,
                          () -> register.students().add(new Student("s2", "Anna Bianchi", "anna@scuola.it")));
                  assertThrows(UnsupportedOperationException.class,
                          () -> register.attendances().add(new Attendance("s1", DAY, AttendanceStatus.ABSENT)));
              }

              @Test
              void listsAttendances() {
                  register.mark("s1", DAY, AttendanceStatus.ABSENT);
                  assertEquals(List.of(new Attendance("s1", DAY, AttendanceStatus.ABSENT)), register.attendances());
              }
          }
    hints:
      - "Due campi: `Map<String, Student> students` e `Map<String, Map<LocalDate, AttendanceStatus>> marks`, entrambi `LinkedHashMap`."
      - "`putIfAbsent` restituisce il valore già presente (o null): ti dice in una riga se l'id era duplicato. Per le presenze: `marks.computeIfAbsent(id, k -> new TreeMap<>()).put(date, status)`."
      - |
        ```java
        private final Map<String, Student> students = new LinkedHashMap<>();
        private final Map<String, Map<LocalDate, AttendanceStatus>> marks = new LinkedHashMap<>();

        public void addStudent(Student student) {
            if (students.putIfAbsent(student.id(), student) != null)
                throw new IllegalArgumentException("studente già presente: " + student.id());
        }

        public void mark(String studentId, LocalDate date, AttendanceStatus status) {
            if (!students.containsKey(studentId))
                throw new IllegalArgumentException("studente sconosciuto: " + studentId);
            marks.computeIfAbsent(studentId, k -> new TreeMap<>()).put(date, status);
        }

        public Optional<AttendanceStatus> statusOf(String studentId, LocalDate date) {
            return Optional.ofNullable(marks.getOrDefault(studentId, Map.of()).get(date));
        }

        public List<Student> students() {
            return List.copyOf(students.values());
        }

        public List<Attendance> attendances() {
            return marks.entrySet().stream()
                    .flatMap(e -> e.getValue().entrySet().stream()
                            .map(d -> new Attendance(e.getKey(), d.getKey(), d.getValue())))
                    .toList();
        }
        ```
    checks:
      - run: mvn -q test -Dtest=RegisterTest
    review:
      - Nessuna collezione interna esposta
      - I campi sono private final

  - id: T05
    milestone: M1
    title: Contare le assenze, test prima
    depends_on: [T04]
    goal: Register.absences(studentId) conta solo le assenze, e l'hai guidato tu con un test.
    learn: [tdd, stream]
    theory: |
      **Test-Driven Development.** Nei team seri spesso il test si scrive *prima* del codice:
      1. **Rosso**: scrivi un test che descrive cosa vuoi e lo vedi fallire.
      2. **Verde**: scrivi il minimo codice che lo fa passare.
      3. **Refactor**: migliori il codice con i test che ti proteggono.

      Così pensi a *cosa* deve fare il metodo prima di pensare a *come*.

      **Il comportamento da ottenere:** `long absences(String studentId)` in `Register`
      - conta solo gli `ABSENT` (i `LATE` non sono assenze)
      - studente senza registrazioni → `0`
      - studente sconosciuto → `IllegalArgumentException`

      **Come procedere:** apri `RegisterStatsTest`, sostituisci il `fail(...)` con un test vero
      (prepara un registro, segna 2 assenze e 1 ritardo, verifica che il risultato sia 2).
      Poi aggiungi il metodo. Il controllo esegue il tuo test **e** il nostro `AbsencesTest`.

      **Stream.** `values().stream().filter(...).count()` conta gli elementi che soddisfano una condizione.

      **Errori tipici:** scrivere il codice e poi un test che "passa per forza"; contare anche i ritardi.
    files:
      - path: src/test/java/it/presenze/model/RegisterStatsTest.java
        content: |
          package it.presenze.model;

          import org.junit.jupiter.api.Test;

          import static org.junit.jupiter.api.Assertions.*;

          class RegisterStatsTest {

              @Test
              void countsOnlyAbsences() {
                  // TODO: crea un Register, aggiungi uno studente, segna 2 ABSENT e 1 LATE
                  //       in giorni diversi, verifica che absences(...) restituisca 2
                  fail("Scrivi il test prima del codice");
              }
          }
      - path: src/main/java/it/presenze/model/Register.java
      - path: src/test/java/it/presenze/model/AbsencesTest.java
        given: true
        content: |
          package it.presenze.model;

          import org.junit.jupiter.api.BeforeEach;
          import org.junit.jupiter.api.Test;

          import java.time.LocalDate;

          import static org.junit.jupiter.api.Assertions.*;

          class AbsencesTest {

              private Register register;

              @BeforeEach
              void setUp() {
                  register = new Register();
                  register.addStudent(new Student("s1", "Mario Rossi", "mario@scuola.it"));
              }

              @Test
              void countsAbsencesOnly() {
                  register.mark("s1", LocalDate.of(2026, 11, 2), AttendanceStatus.ABSENT);
                  register.mark("s1", LocalDate.of(2026, 11, 3), AttendanceStatus.LATE);
                  register.mark("s1", LocalDate.of(2026, 11, 4), AttendanceStatus.PRESENT);
                  register.mark("s1", LocalDate.of(2026, 11, 5), AttendanceStatus.ABSENT);
                  assertEquals(2, register.absences("s1"));
              }

              @Test
              void zeroWhenNoMarks() {
                  assertEquals(0, register.absences("s1"));
              }

              @Test
              void unknownStudentIsAnError() {
                  assertThrows(IllegalArgumentException.class, () -> register.absences("x"));
              }
          }
    hints:
      - "Prima il test: `Register r = new Register(); r.addStudent(...); r.mark(...)` tre volte, poi `assertEquals(2, r.absences(\"s1\"))`. Deve fallire (non compila: il metodo non esiste ancora)."
      - "Nel metodo: controlla che lo studente esista come in `mark`, poi `marks.getOrDefault(id, Map.of()).values().stream().filter(s -> s == AttendanceStatus.ABSENT).count()`."
      - |
        ```java
        // RegisterStatsTest
        @Test
        void countsOnlyAbsences() {
            Register r = new Register();
            r.addStudent(new Student("s1", "Mario Rossi", "mario@scuola.it"));
            r.mark("s1", LocalDate.of(2026, 11, 2), AttendanceStatus.ABSENT);
            r.mark("s1", LocalDate.of(2026, 11, 3), AttendanceStatus.ABSENT);
            r.mark("s1", LocalDate.of(2026, 11, 4), AttendanceStatus.LATE);
            assertEquals(2, r.absences("s1"));
        }

        // Register
        public long absences(String studentId) {
            if (!students.containsKey(studentId))
                throw new IllegalArgumentException("studente sconosciuto: " + studentId);
            return marks.getOrDefault(studentId, Map.of()).values().stream()
                    .filter(s -> s == AttendanceStatus.ABSENT)
                    .count();
        }
        ```
    checks:
      - run: mvn -q test
    review:
      - Il tuo test fallirebbe se absences contasse anche i ritardi
      - Il controllo "studente sconosciuto" non è copiato in due metodi (meglio un metodo privato comune)

  # ---------------------------------------------------------------- M2
  - id: T06
    milestone: M2
    title: Salvare e ricaricare su file
    depends_on: [T05]
    goal: CsvStore salva il registro su file e lo ricarica identico.
    learn: [file-io, formato-csv, eccezioni-checked, round-trip-test]
    theory: |
      **Persistenza.** Finora tutto vive in memoria e sparisce alla chiusura. Salviamo su un file
      di testo, una riga per record, campi separati da `;`:
      ```
      S;s1;Mario Rossi;mario@scuola.it
      A;s1;2026-11-07;ABSENT
      ```
      `S` = studente, `A` = presenza. Gli studenti vanno scritti **prima** delle presenze: al
      caricamento `mark` richiede che lo studente esista già.

      **La classe da creare:** `it.presenze.store.CsvStore`, con due metodi statici:
      - `static void save(Register register, Path file) throws IOException`
      - `static Register load(Path file) throws IOException`

      Regole:
      - file inesistente → registro vuoto (primo avvio)
      - un campo che contiene `;` → `IllegalArgumentException` **prima** di scrivere qualsiasi cosa
      - riga con tipo sconosciuto o numero di campi diverso da 4 → `IOException` con la riga nel messaggio

      **API moderne.** `Files.write(path, righe)` e `Files.readAllLines(path)` di `java.nio.file`
      gestiscono apertura e chiusura del file per te.

      **Test di round-trip.** Il modo migliore per testare salvataggio e caricamento: salvi,
      ricarichi, confronti. `@TempDir` di JUnit dà una cartella temporanea pulita per ogni test.

      **Errori tipici:** `split(";")` senza limite elimina i campi vuoti finali; non chiudere i file.
