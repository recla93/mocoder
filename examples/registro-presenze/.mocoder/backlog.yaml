                  assertEquals("Segnato s1 2026-11-07 ABSENT", cli.execute("mark s1 2026-11-07 absent"));
                  assertEquals("ABSENT", cli.execute("status s1 2026-11-07"));
                  assertEquals("Nessuna registrazione", cli.execute("status s1 2026-11-08"));
                  assertEquals("1", cli.execute("absences s1"));
