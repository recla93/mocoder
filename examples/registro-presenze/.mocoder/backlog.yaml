                  cli.execute("add s1 mario@scuola.it Mario Rossi");
                  assertTrue(cli.execute("add s1 mario@scuola.it Mario Rossi").startsWith("Errore:"));
                  assertTrue(cli.execute("mark s1 07/11/2026 PRESENT").startsWith("Errore:"));
                  assertTrue(cli.execute("mark s1 2026-11-07 MALATO").startsWith("Errore:"));
                  assertTrue(cli.execute("mark s1").startsWith("Errore:"));
