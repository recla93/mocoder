  - id: T08
    milestone: M3
    title: Il programma completo
    depends_on: [T07]
    goal: Il programma legge comandi fino a exit, risponde e salva dopo ogni comando.
    learn: [input-output, persistenza-incrementale, test-di-integrazione]
    theory: |
      **Mettere insieme i pezzi.** `App` ora fa solo da collegamento: carica il registro dal file,
      legge righe, le passa a `Cli`, stampa la risposta e salva. Tutta la logica sta già
      nelle classi che hai testato.

      **Testabile anche qui.** Invece di usare direttamente `System.in` e `System.out`, scrivi
      `public static void run(InputStream in, PrintStream out, Path dataFile) throws IOException`.
      Il `main` chiama `run(System.in, System.out, Path.of("presenze.csv"))` (oppure il percorso
      passato come primo argomento). Il test passa testo finto e legge l'output: è un
      *test di integrazione*, verifica i pezzi insieme.

      **Il ciclo:**
      1. stampa un messaggio di benvenuto che contiene `Registro presenze`
      2. leggi righe finché arriva `exit` o finisce l'input (`readLine()` restituisce `null`)
      3. per ogni riga: risposta di `cli.execute`, stampala se non è vuota, **salva**

      **Perché salvare a ogni comando.** Se il programma si chiude male, perdi al massimo
      l'ultimo comando. Per un file piccolo il costo è trascurabile.

      Alla fine prova davvero: `mvn -q compile` e poi
      `java -cp target/classes it.presenze.App`. Hai costruito un programma intero, a mano.
