          import java.nio.charset.StandardCharsets;
          import java.nio.file.Path;

          import static org.junit.jupiter.api.Assertions.*;

          class AppTest {

              @TempDir
              Path dir;

              private String run(String input, Path data) throws IOException {
                  ByteArrayOutputStream out = new ByteArrayOutputStream();
                  App.run(new ByteArrayInputStream(input.getBytes(StandardCharsets.UTF_8)),
                          new PrintStream(out, true, StandardCharsets.UTF_8), data);
                  return out.toString(StandardCharsets.UTF_8);
              }

              @Test
              void keepsDataBetweenRuns() throws IOException {
                  Path data = dir.resolve("presenze.csv");
                  String first = run("add s1 mario@scuola.it Mario Rossi\nmark s1 2026-11-07 ABSENT\nexit\n", data);
                  assertTrue(first.contains("Registro presenze"));
                  assertTrue(first.contains("Aggiunto s1"));

                  String second = run("absences s1\nexit\n", data);
                  assertTrue(second.lines().anyMatch("1"::equals), second);
              }

              @Test
              void stopsAtExit() throws IOException {
                  String out = run("exit\nadd s1 mario@scuola.it Mario Rossi\n", dir.resolve("presenze.csv"));
                  assertFalse(out.contains("Aggiunto"));
              }

              @Test
              void stopsAtEndOfInput() throws IOException {
                  String out = run("list\n", dir.resolve("presenze.csv"));
                  assertTrue(out.contains("Nessuno studente"));
              }
