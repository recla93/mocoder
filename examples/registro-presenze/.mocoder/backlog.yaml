      - "Costruisci prima tutte le righe in una `List<String>` (studenti, poi presenze) e solo alla fine chiama `Files.write`: se un campo è invalido non hai scritto nulla."
      - "Al caricamento: `line.split(\";\", -1)`, controlla che ci siano 4 parti, poi `switch (parts[0])` con `case \"S\"` e `case \"A\"`; `LocalDate.parse` e `AttendanceStatus.valueOf` ricostruiscono i valori."
