schema: 1
project: registro-presenze
title: Registro presenze
summary: >
  Un programma a riga di comando per registrare studenti e presenze di una classe,
  con salvataggio su file. Costruito passo passo con test automatici, come in un team vero.
level: principiante
estimate_hours: 10
stack: [java-21, maven, junit-5]

milestones:
  - id: M1
    title: Fondamenta e dominio
    goal: Studenti, presenze e registro modellati in Java, coperti da test che passano.
  - id: M2
    title: Persistenza
    goal: Il registro si salva su file e si ricarica senza perdere dati.
  - id: M3
    title: Interfaccia a riga di comando
    goal: Un utente usa il registro da terminale e i dati restano tra un avvio e l'altro.

tasks:
  # ---------------------------------------------------------------- M1
  - id: T01
    milestone: M1
    title: Il progetto Maven e il primo main
    goal: Il progetto compila e stampa "Registro presenze".
    learn: [maven, struttura-progetto, package, metodo-main, git]
    theory: |
      **Perché Maven.** Un progetto Java vero non si compila a mano file per file: un
      *build tool* scarica le librerie, compila, esegue i test. Maven è lo standard più diffuso.
      Il file `pom.xml` descrive il progetto: nome, versione di Java, dipendenze (qui JUnit 5 per i test).

      **La struttura standard.** Maven si aspetta:
      - `src/main/java` → il codice del programma
      - `src/test/java` → i test
      - `target/` → quello che genera Maven (non va mai in git, per questo c'è `.gitignore`)

      **Package = cartelle.** La classe `it.presenze.App` deve stare in
      `src/main/java/it/presenze/App.java` e iniziare con `package it.presenze;`.
      Se cartella e package non coincidono, il compilatore si lamenta.

      **Cosa ti serve.** JDK 21 e Maven installati (`java -version`, `mvn -v` devono rispondere).

      **Errori tipici:** nome del file diverso dal nome della classe pubblica; `package` dimenticato;
      eseguire `mvn` fuori dalla cartella che contiene `pom.xml`.

      Quando il controllo passa, mocoder fa il tuo primo commit: ogni task completato è un commit.
    files:
