  - id: T02
    milestone: M1
    title: Lo studente
    depends_on: [T01]
    goal: Uno Student si crea solo con id, nome ed email validi.
    learn: [java-record, validazione, eccezioni, unit-test]
    theory: |
      **Perché un record.** Uno studente è un *dato*: id, nome, email. Non cambia dopo la creazione.
      Java 21 ha i `record`: una riga ti dà costruttore, getter (`id()`, `fullName()`, `email()`),
      `equals`, `hashCode` e `toString`.

      **Validare all'ingresso.** Un oggetto non valido non deve poter esistere. Nel *compact constructor*
      del record controlli i dati e, se sono sbagliati, lanci `IllegalArgumentException`.
      Così il resto del programma può fidarsi di ogni `Student`.

      Regole:
      - `id` e `fullName` non nulli e non vuoti (`isBlank()`)
      - `email` non nulla, con una sola `@`, testo prima, e un punto dopo la `@`

      **Leggi il test.** `StudentTest` è la specifica: ogni metodo `@Test` descrive un comportamento.
      `assertThrows` verifica che venga lanciata un'eccezione. Leggere i test è il primo modo per
      capire cosa vuole il codice, anche nei team veri.

      **Errori tipici:** controllare `isBlank()` prima di `null` (NullPointerException);
      validare l'email solo con `contains("@")`.
    files:
      - path: src/main/java/it/presenze/model/Student.java
        content: |
          package it.presenze.model;

          public record Student(String id, String fullName, String email) {
              // TODO: aggiungi il compact constructor con la validazione
          }
      - path: src/test/java/it/presenze/model/StudentTest.java
        given: true
        content: |
          package it.presenze.model;

          import org.junit.jupiter.api.Test;

          import static org.junit.jupiter.api.Assertions.*;

          class StudentTest {

              @Test
              void createsValidStudent() {
                  Student s = new Student("s1", "Mario Rossi", "mario.rossi@scuola.it");
                  assertEquals("s1", s.id());
                  assertEquals("Mario Rossi", s.fullName());
                  assertEquals("mario.rossi@scuola.it", s.email());
              }

              @Test
              void sameDataMeansEqualStudents() {
                  assertEquals(new Student("s1", "Mario Rossi", "m@x.it"), new Student("s1", "Mario Rossi", "m@x.it"));
              }

              @Test
              void rejectsBlankId() {
                  assertThrows(IllegalArgumentException.class, () -> new Student(" ", "Mario Rossi", "m@x.it"));
              }

              @Test
              void rejectsMissingName() {
                  assertThrows(IllegalArgumentException.class, () -> new Student("s1", null, "m@x.it"));
                  assertThrows(IllegalArgumentException.class, () -> new Student("s1", "", "m@x.it"));
              }

              @Test
              void rejectsInvalidEmail() {
                  assertThrows(IllegalArgumentException.class, () -> new Student("s1", "Mario Rossi", null));
                  assertThrows(IllegalArgumentException.class, () -> new Student("s1", "Mario Rossi", "mario.rossi"));
                  assertThrows(IllegalArgumentException.class, () -> new Student("s1", "Mario Rossi", "mario@"));
                  assertThrows(IllegalArgumentException.class, () -> new Student("s1", "Mario Rossi", "@scuola.it"));
                  assertThrows(IllegalArgumentException.class, () -> new Student("s1", "Mario Rossi", "a@b@scuola.it"));
              }
          }
    hints:
      - "Il compact constructor si scrive `public Student { ... }`, senza parentesi tonde: i parametri sono già disponibili."
      - "Per l'email: `int at = email.indexOf('@')`. Valida se `at > 0`, se `at == email.lastIndexOf('@')` e se `email.substring(at).contains(\".\")`."
      - |
        ```java
        public record Student(String id, String fullName, String email) {
            public Student {
                if (id == null || id.isBlank()) throw new IllegalArgumentException("id obbligatorio");
                if (fullName == null || fullName.isBlank()) throw new IllegalArgumentException("nome obbligatorio");
                if (email == null) throw new IllegalArgumentException("email obbligatoria");
                int at = email.indexOf('@');
                if (at <= 0 || at != email.lastIndexOf('@') || !email.substring(at).contains("."))
                    throw new IllegalArgumentException("email non valida: " + email);
            }
        }
        ```
    checks:
      - run: mvn -q test -Dtest=StudentTest
    review:
      - I messaggi di errore dicono quale campo è sbagliato
      - Il controllo di null viene prima di ogni metodo chiamato sul valore

  - id: T03
    milestone: M1
    title: Stato e presenza
    depends_on: [T02]
    goal: Esistono gli stati PRESENT, ABSENT, LATE e il record Attendance che rifiuta valori mancanti.
    learn: [enum, java-time, null-safety]
    theory: |
      **Enum: un insieme chiuso di valori.** Lo stato di una presenza può essere solo
      presente, assente o in ritardo. Una `String` accetterebbe anche "assnete"; un `enum` no.
      Crea `AttendanceStatus` con i valori `PRESENT`, `ABSENT`, `LATE` (in quest'ordine).

      **Date vere, non stringhe.** Per i giorni si usa `java.time.LocalDate`: una data senza ora
      né fuso orario. `LocalDate.of(2026, 11, 7)` o `LocalDate.parse("2026-11-07")`.

      **Il record `Attendance`.** Tre componenti: `String studentId`, `LocalDate date`,
      `AttendanceStatus status`. Tutti obbligatori: nel compact constructor usa
      `Objects.requireNonNull(valore, "messaggio")`, che lancia `NullPointerException`.

      Questa volta crei tu i due file, nel package `it.presenze.model`:
      `AttendanceStatus.java` e `Attendance.java`. Il test non compilerà finché non esistono:
      è normale, leggi l'errore del compilatore e segui il nome che manca.

      **Errori tipici:** usare `java.util.Date` (vecchia API); dimenticare `import java.time.LocalDate`.
    files:
      - path: src/main/java/it/presenze/model/AttendanceStatus.java
      - path: src/main/java/it/presenze/model/Attendance.java
      - path: src/test/java/it/presenze/model/AttendanceTest.java
        given: true
        content: |
          package it.presenze.model;

          import org.junit.jupiter.api.Test;

          import java.time.LocalDate;

          import static org.junit.jupiter.api.Assertions.*;

          class AttendanceTest {

              private static final LocalDate DAY = LocalDate.of(2026, 11, 7);

              @Test
              void hasThreeStatusesInOrder() {
                  assertArrayEquals(
                          new AttendanceStatus[]{AttendanceStatus.PRESENT, AttendanceStatus.ABSENT, AttendanceStatus.LATE},
                          AttendanceStatus.values());
              }

              @Test
              void storesValues() {
                  Attendance a = new Attendance("s1", DAY, AttendanceStatus.LATE);
                  assertEquals("s1", a.studentId());
                  assertEquals(DAY, a.date());
                  assertEquals(AttendanceStatus.LATE, a.status());
              }

              @Test
              void rejectsMissingValues() {
                  assertThrows(NullPointerException.class, () -> new Attendance(null, DAY, AttendanceStatus.PRESENT));
                  assertThrows(NullPointerException.class, () -> new Attendance("s1", null, AttendanceStatus.PRESENT));
                  assertThrows(NullPointerException.class, () -> new Attendance("s1", DAY, null));
              }
          }
    hints:
      - "Un enum si dichiara come una classe: `public enum AttendanceStatus { ... }` con i valori separati da virgola."
      - "Nel record: `public Attendance { Objects.requireNonNull(studentId, \"studentId\"); ... }` e `import java.util.Objects;`."
      - |
        ```java
        // AttendanceStatus.java
        package it.presenze.model;

        public enum AttendanceStatus { PRESENT, ABSENT, LATE }

        // Attendance.java
        package it.presenze.model;

        import java.time.LocalDate;
        import java.util.Objects;

        public record Attendance(String studentId, LocalDate date, AttendanceStatus status) {
            public Attendance {
                Objects.requireNonNull(studentId, "studentId");
                Objects.requireNonNull(date, "date");
                Objects.requireNonNull(status, "status");
            }
        }
        ```
    checks:
      - run: mvn -q test -Dtest=AttendanceTest
    review:
      - Nessuna data rappresentata come String
      - Un file per tipo pubblico

  - id: T04
    milestone: M1
    title: Il registro
    depends_on: [T03]
    goal: Il Register gestisce studenti e presenze e protegge i propri dati.
    learn: [collezioni-map, optional, incapsulamento]
    theory: |
      **Una classe che custodisce dati.** `Register` è il cuore del programma: tiene studenti e
      presenze e decide le regole. Gli altri lo usano solo attraverso i suoi metodi: è
      l'*incapsulamento*. Nessuno deve poter modificare le sue liste dall'esterno.

      **Map per cercare in fretta.** Per trovare uno studente dal suo id si usa una `Map<String, Student>`.
      `LinkedHashMap` ricorda l'ordine di inserimento, utile per stampare e salvare in modo stabile.
      Per le presenze: una mappa da id studente a una mappa data → stato.

      **Le regole:**
      - `addStudent(Student)`: id già presente → `IllegalArgumentException`
      - `mark(studentId, date, status)`: studente sconosciuto → `IllegalArgumentException`; segnare
        di nuovo lo stesso giorno sostituisce lo stato precedente
      - `statusOf(studentId, date)`: restituisce `Optional<AttendanceStatus>`, vuoto se non c'è nulla
      - `students()` e `attendances()`: liste **non modificabili** (`List.copyOf`, `.toList()`)

      **Perché Optional.** Restituire `null` obbliga chi chiama a ricordarsi di controllarlo.
      `Optional` rende esplicito che il valore può mancare.

      **Errori tipici:** restituire direttamente la collezione interna; dimenticare di controllare
      che lo studente esista prima di segnare.
    files:
