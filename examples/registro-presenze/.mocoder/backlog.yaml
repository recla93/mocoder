  - id: T07
    milestone: M3
    title: I comandi
    depends_on: [T06]
    goal: Cli trasforma una riga di testo in un'azione sul registro e restituisce la risposta.
    learn: [parsing-comandi, switch-expression, separazione-io-logica, gestione-errori]
    theory: |
      **Separare logica e input/output.** Leggere dalla tastiera e stampare è difficile da testare.
      Per questo la classe `it.presenze.cli.Cli` non legge né stampa: riceve una riga e
      **restituisce** la risposta come `String`. Il ciclo di lettura arriverà nel prossimo task.

      **API:** `new Cli(Register register)` e `String execute(String line)`.

      | Comando | Risposta |
      |---|---|
      | `add <id> <email> <nome completo>` | `Aggiunto <id>` |
      | `mark <id> <aaaa-mm-gg> <stato>` (stato senza distinguere maiuscole) | `Segnato <id> <data> <STATO>` |
      | `status <id> <aaaa-mm-gg>` | `PRESENT` / `ABSENT` / `LATE` oppure `Nessuna registrazione` |
      | `absences <id>` | il numero, es. `2` |
      | `list` | una riga `id - nome` per studente, oppure `Nessuno studente` |
      | `help` | l'elenco dei comandi |
      | riga vuota | stringa vuota |
      | altro | `Comando sconosciuto: <comando>. Scrivi help.` |

      **Gli errori non fanno crashare il programma.** Argomenti sbagliati, data illeggibile,
      studente sconosciuto: rispondi `Errore: <messaggio>`. Cattura `IllegalArgumentException`
      e `DateTimeException`, non `Exception` (nasconderesti i bug veri).

      **Switch expression.** `return switch (cmd) { case "add" -> ...; default -> ...; };`
      Con `yield` restituisci un valore da un blocco `{ }`.

      **Errori tipici:** `split(" ")` si rompe con due spazi (usa `"\\s+"`); il nome completo
      contiene spazi, quindi va per ultimo e serve `split(regex, 4)`.
